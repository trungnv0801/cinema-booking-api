spring:
  application:
    name: cinema-booking
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  liquibase:
    changeLog: classpath:/db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:dev}
  jpa:
    hibernate:
      ddl-auto: validate
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  api:
    prefix: /api/v1
  server:
    url: ${APP_SERVER_URL:http://localhost:8080}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  cookie:
    secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  show-actuator: true
  api-docs:
    path: /api-docs
